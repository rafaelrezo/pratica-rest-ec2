# Usar apos gerar o certificado didatico com o DNS publico da EC2 no SAN.
# Substitui redes-http.conf na etapa HTTPS da pratica 1.
server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/redes.crt;
    ssl_certificate_key /etc/nginx/tls/redes.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/redes;
    index index.html;
    client_max_body_size 16k;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
